plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aibrowser'
    compileSdk 28

    defaultConfig {
        applicationId "com.example.aibrowser"
        minSdk 27
        targetSdk 28
        versionCode 1
        versionName "2.0"
        
        // 确保只打包 32 位架构，防止体积过大
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 引入独立的 GeckoView 内核 (32位版)
    implementation "org.mozilla.geckoview:geckoview-nightly-armeabi-v7a:126.0.20240510093057"
}
