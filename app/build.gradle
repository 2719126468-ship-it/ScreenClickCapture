plugins { id 'com.android.application' }

android {
    namespace 'com.example.aibrowser'
    compileSdk 35   // WebViewUpgrade core 要求 compileSdk 35[reference:1]

    defaultConfig {
        applicationId "com.example.aibrowser"
        minSdk 27
        targetSdk 28
        versionCode 1
        versionName "3.0"
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories { google(); mavenCentral() }

dependencies {
    // 注意 group ID 是 io.github.jonanorman:android-webviewup[reference:2][reference:3]
    implementation 'io.github.jonanorman:android-webviewup:core:0.1.0'
}
