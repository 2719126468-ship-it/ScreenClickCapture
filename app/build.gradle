plugins { id 'com.android.application' }

android {
    namespace 'com.example.aibrowser'
    compileSdk 28

    defaultConfig {
        applicationId "com.example.aibrowser"
        minSdk 27
        targetSdk 28
        versionCode 1
        versionName "2.0"
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://maven.mozilla.org/maven2/" }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview-nightly-armeabi-v7a:139.0.20250413095036"
}
