plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aibrowser'
    compileSdk 28

    defaultConfig {
        applicationId "com.example.aibrowser"
        minSdk 27
        targetSdk 28
        versionCode 1
        versionName "2.0"
        
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
    // 关键：加上 Mozilla 官方仓库
    maven { url "https://maven.mozilla.org/maven2/" }
}

dependencies {
    // 使用稳定版 GeckoView，并明确指定 32 位（armeabi-v7a）架构
    implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:126.0.20240510093057"
}
