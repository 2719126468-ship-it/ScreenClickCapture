plugins { id 'com.android.application' }

android {
    namespace 'com.example.aibrowser'
    compileSdk 35 // WebViewUpgrade 要求 35+

    defaultConfig {
        applicationId "com.example.aibrowser"
        minSdk 27 // 保持 27，兼容你的 Android 8.1 设备
        targetSdk 33 // WebViewUpgrade 推荐 33+
        versionCode 1
        versionName "3.0"
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories { google(); mavenCentral() }

dependencies {
    // 官方正确坐标，并排除冲突的 appcompat 传递依赖
    implementation('io.github.jonanorman.android.webviewup:core:0.1.0') {
        exclude group: 'androidx.appcompat', module: 'appcompat'
    }
}
