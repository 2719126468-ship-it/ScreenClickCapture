name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-28 build-tools;28.0.3'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # ======== 关键：让云端服务器帮你下载内核 ========
      - name: Download WebView Core
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/webview.apk "https://github.com/JonaNorman/WebViewPackage/releases/download/android/134.0.6998.39_min26_arm32.apk"
          ls -lh app/src/main/assets/webview.apk
      # ===============================================

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-click-capture-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
